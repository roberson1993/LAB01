<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <nav class="topbar" aria-label="Main navigation">
        <ul class="nav">
          <li><a href="#">Home</a></li>
          <li><a href="#">Demand</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>

      <header class="hero">
        <h1>Des pièces <span>identités</span> retrouvées</h1>

        <div class="search-bar">
          <span class="search-icon" aria-hidden="true">🔍</span>
          <input type="text" placeholder="Entrer ton nom...." aria-label="Search" />
          <button type="button">Search</button>
        </div>
      </header>

      <main>
        <p class="section-label">List de pieces</p>
        <div class="profile-card">
          <img src="driver.jpeg" alt="Driver Image" class="driver-image" />
          <div class="profile-info">
            <p class="profile-name">John Doe Jean</p>
            <span class="profile-badge">✔ Verified</span>
            <p class="profile-meta">Retrouvées en Nov 12, 2026 · Cap-haitien, Haiti</p>
            <div class="profile-actions">
              <button class="btn-primary" type="button">Reclamation</button>
              <button class="btn-ghost" type="button">Plus de détails</button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
