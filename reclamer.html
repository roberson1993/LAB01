<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire de Réclamation</title>
    <style>
        /* ── Reset & Base ── */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* ── Card ── */
        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            padding: 2.5rem 3rem;
            width: 100%;
            max-width: 480px;
        }

        /* ── Header ── */
        .card-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .card-header .icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .card-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #2d2d2d;
            letter-spacing: -0.5px;
        }

        .card-header p {
            margin-top: 0.4rem;
            color: #777;
            font-size: 0.9rem;
        }

        /* ── Divider ── */
        .divider {
            border: none;
            border-top: 2px solid #f0f0f0;
            margin-bottom: 2rem;
        }

        /* ── Form groups ── */
        .form-group {
            margin-bottom: 1.4rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group label {
            font-size: 0.82rem;
            font-weight: 600;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e8e8e8;
            border-radius: 10px;
            font-size: 0.95rem;
            color: #2d2d2d;
            background: #fafafa;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            outline: none;
        }

        .form-group input::placeholder {
            color: #bbb;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
            background: #fff;
        }

        .form-group input[type="date"] {
            cursor: pointer;
        }

        /* ── Row layout (Nom + Prénom side by side) ── */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        /* ── Textarea ── */
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* ── Submit button ── */
        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            margin-top: 0.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            letter-spacing: 0.3px;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn-submit:hover {
            opacity: 0.92;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        /* ── Footer note ── */
        .footer-note {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.78rem;
            color: #aaa;
        }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .card {
                padding: 2rem 1.5rem;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="card-header">
            <div class="icon">📋</div>
            <h1>Formulaire de Réclamation</h1>
            <p>Veuillez remplir tous les champs ci-dessous.</p>
        </div>
        <hr class="divider">

        <form>
            <!-- Nom & Prénom -->
            <div class="form-row">
                <div class="form-group">
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" name="Nom" placeholder="Dupont">
                </div>
                <div class="form-group">
                    <label for="prenom">Prénom</label>
                    <input type="text" id="prenom" name="Prenom" placeholder="Jean">
                </div>
            </div>

            <!-- Date de récupération -->
            <div class="form-group">
                <label for="date">
                    Le jour où vous envisagez de passer récupérer…
                </label>
                <input type="date" id="date" name="date">
            </div>

            <!-- Message / Description -->
            <div class="form-group">
                <label for="message">Description de la réclamation</label>
                <textarea id="message" name="message" placeholder="Décrivez votre réclamation ici…"></textarea>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-submit">Envoyer la réclamation</button>
        </form>

        <p class="footer-note">Vos informations restent confidentielles.</p>
    </div>

</body>
</html>
